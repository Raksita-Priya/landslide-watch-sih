<!DOCTYPE html>
<html>
<head>
  <title>Disaster Dashboard</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    h1 { text-align: center; }
    .stats { display: flex; justify-content: space-around; flex-wrap: wrap; margin: 20px 0; }
    .card { background: white; border-radius: 8px; padding: 20px; text-align: center; width: 150px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 10px; }
    .card h2 { margin: 0; font-size: 28px; }
    .card p { margin: 5px 0 0; color: #555; }
    .reports { background: white; border-radius: 8px; padding: 15px; margin-top: 20px; max-width: 700px; margin-left: auto; margin-right: auto; }
    .report-item { padding: 14px 10px; border-bottom: 1px solid #eee; }
    .report-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .red { color: red; font-weight: bold; }
    .orange { color: orange; font-weight: bold; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-pending { background: #fff3cd; color: #856404; }
    .badge-verified { background: #d4edda; color: #155724; }
    .confirm-btn { padding: 6px 12px; border: 1px solid #1565C0; background: white; color: #1565C0; border-radius: 5px; cursor: pointer; font-size: 12px; }
    .confirm-btn:hover { background: #1565C0; color: white; }
    .confirm-btn:disabled { border-color: #aaa; color: #aaa; cursor: not-allowed; background: #f0f0f0; }
    .count-text { font-size: 12px; color: #777; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Disaster Dashboard</h1>

  <div class="stats">
    <div class="card"><h2>04</h2><p>Active Alerts</p></div>
    <div class="card"><h2>07</h2><p>High Risk Zones</p></div>
    <div class="card"><h2 id="reportCount">32</h2><p>Citizen Reports</p></div>
    <div class="card"><h2>05</h2><p>Blocked Roads</p></div>
  </div>

  <div class="reports">
    <h3>Recent Reports</h3>
    <div id="reportList"></div>
  </div>

  <script>
    const CONFIRM_THRESHOLD = 5;

    const defaultReports = [
      { id: "r1", type: "Landslide", cls: "red", location: "District X", time: "10 min ago", confirmations: 2 },
      { id: "r2", type: "Road Blockage", cls: "orange", location: "District Y", time: "18 min ago", confirmations: 5 },
      { id: "r3", type: "Slope Crack", cls: "red", location: "District Z", time: "25 min ago", confirmations: 0 }
    ];

    function loadReports() {
      const saved = localStorage.getItem("landslideReports");
      return saved ? JSON.parse(saved) : defaultReports;
    }

    function saveReports(reports) {
      localStorage.setItem("landslideReports", JSON.stringify(reports));
    }

    function hasUserConfirmed(id) {
      return localStorage.getItem("confirmed_" + id) === "yes";
    }

    function confirmReport(id) {
      let reports = loadReports();
      const report = reports.find(r => r.id === id);
      if (report && !hasUserConfirmed(id)) {
        report.confirmations += 1;
        localStorage.setItem("confirmed_" + id, "yes");
        saveReports(reports);
        renderReports();
      }
    }

    function renderReports() {
      const reports = loadReports();
      const container = document.getElementById("reportList");
      container.innerHTML = "";

      reports.forEach(r => {
        const isVerified = r.confirmations >= CONFIRM_THRESHOLD;
        const userConfirmed = hasUserConfirmed(r.id);

        const div = document.createElement("div");
        div.className = "report-item";
        div.innerHTML = `
          <div class="report-top">
            <div>
              <span class="${r.cls}">${r.type}</span> — ${r.location} — ${r.time}
              <span class="badge ${isVerified ? 'badge-verified' : 'badge-pending'}">
                ${isVerified ? "✅ VERIFIED" : "⏳ PENDING"}
              </span>
            </div>
            <button class="confirm-btn" ${userConfirmed || isVerified ? "disabled" : ""} onclick="confirmReport('${r.id}')">
              ${userConfirmed ? "You confirmed this" : "Confirm this report"}
            </button>
          </div>
          <div class="count-text">${r.confirmations} / ${CONFIRM_THRESHOLD} confirmations needed to verify</div>
        `;
        container.appendChild(div);
      });
    }

    renderReports();
  </script>
</body>
</html>
