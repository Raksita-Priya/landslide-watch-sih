<!DOCTYPE html>
<html>
<head>
  <title>Warning Alert</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #fff5f5; }
    .alert-box { background: white; border: 3px solid red; border-radius: 8px; padding: 25px; max-width: 500px; margin: auto; }
    h1 { color: red; text-align: center; }
    .risk { font-size: 24px; font-weight: bold; color: red; }
    .reason { margin-top: 15px; line-height: 1.6; }
    .action { margin-top: 20px; padding: 15px; background: #ffe5e5; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="alert-box">
    <h1>HIGH RISK ALERT</h1>

    <p><strong>Location:</strong> XYZ District</p>
    <p><strong>Risk:</strong> <span class="risk">HIGH</span></p>

    <div class="reason">
      <strong>Reason:</strong><br>
      Heavy rainfall<br>
      + High soil moisture<br>
      + Steep slope
    </div>

    <div class="action">
      <strong>Recommended action:</strong><br>
      Avoid vulnerable roads and monitor the area.
    </div>
  </div>
</body>
</html>
