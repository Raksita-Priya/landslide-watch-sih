<!DOCTYPE html>
<html>
<head>
  <title>Risk Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <style>
    #map { height: 500px; width: 100%; }
  </style>
</head>
<body>
  <h1>Landslide Risk Map</h1>
  <div id="map"></div>

  <script>
    var map = L.map('map').setView([25.5, 93.0], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

    function addMarker(lat, lng, risk, color) {
      L.circleMarker([lat, lng], {
        radius: 10,
        fillColor: color,
        color: "#000",
        weight: 1,
        fillOpacity: 0.8
      }).addTo(map).bindPopup("Risk: " + risk);
    }

    addMarker(25.57, 91.88, "LOW", "green");
    addMarker(26.14, 91.73, "MODERATE", "yellow");
    addMarker(27.48, 94.90, "HIGH", "orange");
    addMarker(25.67, 94.11, "CRITICAL", "red");
  </script>
</body>
</html>
